name: Email Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  call-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Call email worker
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            "https://letssuccess.in/api/email-worker.php"
